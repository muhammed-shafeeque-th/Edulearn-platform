---
- name: Loki deployment summary
  ansible.builtin.debug:
    msg:
      - "========================================"
      - "Loki Deployment Summary"
      - "========================================"
      - "Namespace        : {{ loki_namespace }}"
      - "Release          : {{ loki_release_name }}"
      - "Deployment Mode  : SingleBinary"
      - "Chart Version    : {{ loki_chart_version }}"
      - "Bucket           : {{ loki_bucket_name }}"
      - "Storage Backend  : Amazon S3"
      - "Retention        : {{ loki_retention }}"
      - "Service Type     : ClusterIP"
      - "ServiceMonitor   : Enabled"
      - "Pod Identity     : Enabled"
      - "Status           : Healthy"