---
# Namespace

otel_namespace: observability

# Helm1

otel_release_name: otel-collector

otel_chart_repo: https://open-telemetry.github.io/opentelemetry-helm-charts

otel_chart_name: open-telemetry/opentelemetry-collector

otel_chart_version: "0.129.0"

# Deployment

otel_mode: deployment

otel_replica_count: 2

# Service

otel_service_type: ClusterIP

# Resources

otel_resources:

  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: "1"
    memory: 1Gi

# Ports

otel_otlp_grpc_port: 4317

otel_otlp_http_port: 4318

otel_metrics_port: 8888

otel_health_port: 13133

otel_pprof_port: 1777

otel_zpages_port: 55679

# Exporters

tempo_endpoint: tempo.observability.svc.cluster.local:4317

loki_endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

# Prometheus

prometheus_release_label: kube-prometheus-stack

# Security

otel_fs_group: 10001

otel_run_as_user: 10001

otel_run_as_group: 10001

# Memory Limiter

otel_memory_limit_percentage: 80

otel_memory_spike_limit_percentage: 25

otel_memory_check_interval: 5s

# Batch Processor

otel_batch_timeout: 5s

otel_batch_send_batch_size: 1024

# Logging

otel_log_level: info

# Monitoring

otel_service_monitor_enabled: true

# Pod Identity

otel_service_account: otel-collector

# Deployment Labels

otel_labels:

  app.kubernetes.io/part-of: observability

  app.kubernetes.io/component: telemetry

  app.kubernetes.io/managed-by: ansible
