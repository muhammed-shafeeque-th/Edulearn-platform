---
- name: Wait for Deployment
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ otel_namespace }}"
    name: "{{ otel_release_name }}"
  register: otel_deployment
  retries: 30
  delay: 10
  until:
  - otel_deployment.resources | length > 0
  - (otel_deployment.resources[0].status.readyReplicas | default(0)) >= otel_replica_count

- name: Verify Pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ otel_namespace }}"
    label_selectors:
    - app.kubernetes.io/instance={{ otel_release_name }}
  register: otel_pods

- name: Ensure all Pods are Running
  ansible.builtin.assert:
    that:
    - otel_pods.resources | length > 0
    - >
      otel_pods.resources | map(attribute='status.phase') | unique == ['Running']

- name: Verify Service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ otel_namespace }}"
    name: "{{ otel_release_name }}"
  register: otel_service

- name: Ensure Service exists
  ansible.builtin.assert:
    that:
    - otel_service.resources | length == 1

- name: Verify ServiceMonitor
  kubernetes.core.k8s_info:
    api_version: monitoring.coreos.com/v1
    kind: ServiceMonitor
    namespace: "{{ otel_namespace }}"
    name: "{{ otel_release_name }}"
  when: otel_service_monitor_enabled

- name: Wait for Health Endpoint
  ansible.builtin.uri:
    url: "http://{{ otel_release_name }}.{{ otel_namespace }}.svc.cluster.local:{{ otel_health_port }}"
    method: GET
    status_code: 200
  register: otel_health
  retries: 20
  delay: 5
  until: otel_health.status == 200

- name: Verify Metrics Endpoint
  ansible.builtin.uri:
    url: "http://{{ otel_release_name }}.{{ otel_namespace }}.svc.cluster.local:{{ otel_metrics_port }}/metrics"
    method: GET
    status_code: 200
  register: otel_metrics

- name: Verify OTLP gRPC Port
  ansible.builtin.wait_for:
    host: "{{ otel_release_name }}.{{ otel_namespace }}.svc.cluster.local"
    port: "{{ otel_otlp_grpc_port }}"
    timeout: 30

- name: Verify OTLP HTTP Port
  ansible.builtin.wait_for:
    host: "{{ otel_release_name }}.{{ otel_namespace }}.svc.cluster.local"
    port: "{{ otel_otlp_http_port }}"
    timeout: 30
