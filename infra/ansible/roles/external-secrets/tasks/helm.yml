- name: Add Helm repository
  kubernetes.core.helm_repository:
    name: external-secrets
    repo_url: https://charts.external-secrets.io

- name: Install External Secrets
  kubernetes.core.helm:
    release_name: "{{ external_secrets_release }}"

    release_namespace: "{{ external_secrets_namespace }}"

    chart_ref: external-secrets/external-secrets

    chart_version: "{{ external_secrets_chart_version }}"

    create_namespace: false

    values:
      installCRDs: "{{ external_secrets_install_crds }}"

    wait: true

    wait_timeout: 10m
