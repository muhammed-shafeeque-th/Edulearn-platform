---
- name: Wait for Prometheus Operator

  kubernetes.core.k8s_info:

    api_version: apps/v1

    kind: Deployment

    namespace: "{{ monitoring_namespace }}"

    name: "{{ kube_prometheus_release_name }}-operator"

  register: operator

  retries: 30

  delay: 20

  until:
  - operator.resources | length > 0
  - operator.resources[0].status.readyReplicas | default(0) > 0

- name: Verify ServiceMonitor CRD

  kubernetes.core.k8s_info:

    api_version: apiextensions.k8s.io/v1

    kind: CustomResourceDefinition

    name: servicemonitors.monitoring.coreos.com

- name: Verify ServiceMonitor CRD

  kubernetes.core.k8s_info:

    api_version: apiextensions.k8s.io/v1

    kind: CustomResourceDefinition

    name: prometheusrules.monitoring.coreos.com

- name: Verify ServiceMonitor CRD

  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: alertmanagerconfigs.monitoring.coreos.com

- name: Display deployment summary

  ansible.builtin.debug:

    msg:

    - "kube-prometheus-stack installed successfully"

    - "Namespace: {{ monitoring_namespace }}"

    - "Release: {{ kube_prometheus_release_name }}"

    - "Grafana: Ready"

    - "Prometheus: Ready"

    - "Alertmanager: Ready"
