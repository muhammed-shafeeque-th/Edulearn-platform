---
- name: Create observability namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ fluentbit_namespace }}"

- name: Add Fluent Helm repository
  kubernetes.core.helm_repository:
    name: fluent
    repo_url: "{{ fluentbit_chart_repo }}"

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Render values.yaml
  ansible.builtin.template:
    src: values.yaml.j2
    dest: /tmp/fluent-bit-values.yaml
    mode: "0644"