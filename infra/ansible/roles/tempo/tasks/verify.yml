- name: Wait for Tempo pod Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ tempo_namespace }}"
    label_selectors:
      - app.kubernetes.io/name=tempo
  register: tempo_pods
  retries: 30
  delay: 10
  until: >
    tempo_pods.resources | length > 0 and
    (
      tempo_pods.resources[0].status.conditions
      | selectattr('type', 'equalto', 'Ready')
      | map(attribute='status')
      | first
    ) == "True"