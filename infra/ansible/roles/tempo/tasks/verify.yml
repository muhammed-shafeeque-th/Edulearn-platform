---
- name: Wait for Tempo StatefulSet
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    namespace: "{{ tempo_namespace }}"
    name: "{{ tempo_release_name }}"
  register: tempo_statefulset
  retries: 30
  delay: 10
  until:
    - tempo_statefulset.resources | length > 0
    - (tempo_statefulset.resources[0].status.readyReplicas | default(0)) >= 1

- name: Verify Service
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Service
    namespace: "{{ tempo_namespace }}"
    name: "{{ tempo_release_name }}"

- name: Verify PVC
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    namespace: "{{ tempo_namespace }}"
  register: tempo_pvc

- name: Ensure PVC Bound
  ansible.builtin.assert:
    that:
      - tempo_pvc.resources | length > 0
      - >
        tempo_pvc.resources |
        map(attribute='status.phase') |
        unique == ['Bound']

- name: Verify ServiceMonitor
  kubernetes.core.k8s_info:
    api_version: monitoring.coreos.com/v1
    kind: ServiceMonitor
    namespace: "{{ tempo_namespace }}"
    name: "{{ tempo_release_name }}"

