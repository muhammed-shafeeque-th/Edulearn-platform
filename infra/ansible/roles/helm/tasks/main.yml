---
- name: Download Helm
  get_url:
    url: https://get.helm.sh/helm-v3.15.0-linux-amd64.tar.gz
    dest: /tmp/helm.tar.gz

- name: Extract Helm
  unarchive:
    src: /tmp/helm.tar.gz
    dest: /tmp
    remote_src: yes

- name: Install Helm
  copy:
    src: /tmp/linux-amd64/helm
    dest: /usr/local/bin/helm
    mode: '0755'
    remote_src: yes

- name: Verify Helm
  command: helm version
  register: helm_version
  changed_when: false
