apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edulearn-common.fullname" . }}-postgres-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-databases
          image: bitnami/postgresql:latest
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
          command:
            - /bin/bash
            - -c
            - |
              until pg_isready -h edulearn-app-postgresql -U postgres; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done

              for db in auth_service payment_service user_service course_service notification_service order_service; do
                psql -h edulearn-app-postgresql -U postgres -d postgres -tc \
                  "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 || \
                  psql -h edulearn-app-postgresql -U postgres -d postgres -c "CREATE DATABASE \"${db}\";"
              done