enabled: true

kafka:
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 4.0.0-debian-12-r10

  kraft:
    enabled: true

  zookeeper:
    enabled: false

  controller:
    replicaCount: 1
    controllerOnly: true

    nodeSelector:
      workload: stateful
      topology: ap-south-1a

    tolerations:
      - key: workload
        operator: Equal
        value: stateful
        effect: NoSchedule

    persistence:
      enabled: true
      storageClass: gp3
      size: 2Gi

    pdb:
      create: true
      minAvailable: 1

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 400m
        memory: 512Mi

  broker:
    replicaCount: 1

    persistence:
      enabled: true
      storageClass: gp3
      size: 2Gi

    nodeSelector:
      workload: stateful

    tolerations:
      - key: workload
        operator: Equal
        value: stateful
        effect: NoSchedule

    pdb:
      create: true
      minAvailable: 1

    resources:
      requests:
        cpu: 150m
        memory: 384Mi
      limits:
        cpu: 600m
        memory: 768Mi
        
    extraConfig: |
      offsets.topic.replication.factor=1
      transaction.state.log.replication.factor=1
      transaction.state.log.min.isr=1
      default.replication.factor=1
      min.insync.replicas=1
      num.partitions=1

  listeners:
    client:
      protocol: PLAINTEXT

    controller:
      protocol: PLAINTEXT

    interbroker:
      protocol: PLAINTEXT

  autoCreateTopicsEnable: true
  deleteTopicEnable: true

  defaultReplicationFactor: 1
  offsetsTopicReplicationFactor: 1
  transactionStateLogReplicationFactor: 1
  transactionStateLogMinIsr: 1

  networkPolicy:
    enabled: true # false

metrics:
  kafka:
    enabled: true

  jmx:
    enabled: true

  serviceMonitor:
    enabled: true
    namespace: monitoring

    labels:
      release: kube-prometheus-stack

    interval: 30s