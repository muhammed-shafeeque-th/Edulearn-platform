      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - stateless

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

  env:
    NODE_ENV: "production"
    SERVICE_NAME: chat-service
    serviceVersion: "0.0.1"
    HTTP_PORT: 3000
    GRPC_PORT: 50059

  configMaps:
    - edulearn-chat-config

  secretRefs:
    - edulearn-chat-secret

  externalSecret:
    enabled: true
    refreshInterval: 5m
    targetSecretName: edulearn-chat

    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore

    dataFrom:
      - extract:
          key: edulearn/prod/chat

  configData:
    DATABASE_HOST: "edulearn-app-postgresql"
    DATABASE_PORT: "5432"
    DATABASE_NAME: chat_service
    DATABASE_MAX_CONNECTIONS: "50"
    DATABASE_MIN_CONNECTIONS: "10"
    DATABASE_CONNECTION_TIMEOUT: "30000"
    DATABASE_IDLE_TIMEOUT: "10000"

    REDIS_DB: "0"
    REDIS_MAX_CONNECTIONS: "100"
    REDIS_MIN_CONNECTIONS: "10"
    REDIS_TTL_DEFAULT: "86400"
    REDIS_KEY_PREFIX: "edulearn:chat:"

    ALLOWED_ORIGINS: https://edulearn.muhammedshafeeque.online,http://localhost:9000

    APP_PUBLIC_ASSETS_URL: https://assets.muhammedshafeeque.online

    GRPC_PORT: "50059"
    GRPC_MAX_CONCURRENT_STREAMS: "100"
    GRPC_MAX_CONNECTION_IDLE: 15s
    GRPC_MAX_CONNECTION_AGE: 30s
    GRPC_MAX_CONNECTION_AGE_GRACE: 5s
    GRPC_TIME: 2h
    GRPC_TIMEOUT: 20s

    KAFKA_CLIENT_ID: chat-service
    KAFKA_CONSUMER_GROUP: chat-service-group
    KAFKA_MAX_POLL_RECORDS: "100"
    KAFKA_FETCH_MAX_BYTES: "5242880"
    KAFKA_SASL_ENABLED: "false"

    METRICS_PATH: /metrics
    METRICS_ENABLED: "true"

    LOG_LEVEL: info
    LOG_FORMAT: json

    TRACING_ENABLED: "true"
    TRACING_SERVICE_NAME: chat-service

  configMounts: []

externalSecret:
  enabled: true
  refreshInterval: 5m
  targetSecretName: edulearn
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  dataFrom:
    - extract:
        key: edulearn/prod/common

configData:
  REDIS_URL: redis://edulearn-app-redis-master:6379
  REDIS_ADDR: edulearn-app-redis-master:6379
  REDIS_HOST: edulearn-app-redis-master
  REDIS_PORT: "6379"
  REDIS_LAZY_CONNECT: "true"
  REDIS_DB: "0"
  REDIS_MAX_CONNECTIONS: "100"
  REDIS_MIN_CONNECTIONS: "10"
  REDIS_TTL: "3600"

  AUTH_SERVICE_GRPC: edulearn-auth:50051
  USER_SERVICE_GRPC: edulearn-user:50052
  COURSE_SERVICE_GRPC: edulearn-course:50053
  NOTIFICATION_SERVICE_GRPC: edulearn-notification:50056
  PAYMENT_SERVICE_GRPC: edulearn-payment:50055
  ORDER_SERVICE_GRPC: edulearn-order:50054
  CHAT_SERVICE_GRPC: edulearn-chat:50059

  APP_ASSETS_URL: https://assets.muhammedshafeeque.online
  SITE_URL: https://edulearn.muhammedshafeeque.online
  APP_BASE_DOMAIN: .muhammedshafeeque.online
  
  # CORS CONFIGURATION
  ALLOWED_ORIGINS: https://edulearn.muhammedshafeeque.online,http://localhost:9000
  ALLOWED_METHODS: GET,POST,PUT,DELETE,PATCH,OPTIONS

  GRPC_TIMEOUT: "30000"
  GRPC_MAX_RECEIVE_MESSAGE_LENGTH: "4194304"
  GRPC_MAX_SEND_MESSAGE_LENGTH: "4194304"
  GRPC_KEEPALIVE_TIME: "30000"
  GRPC_KEEPALIVE_TIMEOUT: "5000"
  GRPC_KEEPALIVE_PERMIT_WITHOUT_CALLS: "true"

  KAFKA_BROKERS: edulearn-app-kafka:9092
  KAFKA_BROKER: edulearn-app-kafka:9092
  KAFKA_SSL: "false"
  KAFKA_SASL_USERNAME: ""
  KAFKA_SASL_PASSWORD: ""
  KAFKA_SASL_MECHANISM: PLAIN
  KAFKA_CONSUMER_GROUP: api-gateway-group
  KAFKA_PRODUCER_ACKS: all
  KAFKA_PRODUCER_RETRIES: "3"
  KAFKA_PRODUCER_BATCH_SIZE: "16384"
  KAFKA_PRODUCER_LINGER_MS: "5"

  OTLP_ENDPOINT: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  METRICS_PATH: /metrics

secretData: {}
configMounts: []

redis:
  enabled: true

  redis:
    architecture: standalone

    auth:
      enabled: false # was false — Redis was running fully open (ALLOW_EMPTY_PASSWORD: yes)
      # existingSecret: redis-secret  # create/populate this secret (e.g. via ExternalSecret, same pattern as postgres below) with key "redis-password"
      # existingSecretPasswordKey: redis-password

    master:
      persistence:
        enabled: true
        storageClass: gp3
        size: 2Gi
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          cpu: 200m
          memory: 256Mi

      nodeSelector:
        workload: stateful

      tolerations:
        - key: workload
          operator: Equal
          value: stateful
          effect: NoSchedule

      pdb:
        create: true
        minAvailable: 1

    replica:
      replicaCount: 0

    commonConfiguration: |-
      appendonly yes
      save 60 1000

    networkPolicy:
      enabled: true # was false — use Bitnami's scoped NetworkPolicy instead of relying solely on the app-level open-egress policies

    image:
      repository: bitnami/redis
      tag: latest

    metrics:
      enabled: true

      serviceMonitor:
        enabled: true
        namespace: monitoring

        interval: 30s

        labels:
          release: kube-prometheus-stack

postgres:
  enabled: true

  postgresql:
    auth:
      existingSecret: postgres-secret

      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: password

      username: postgres
      database: postgres # use default postgres DB for bootstrap

    architecture: standalone

    image:
      repository: bitnami/postgresql
      tag: latest

    primary:
      persistence:
        enabled: true
        storageClass: gp3

        size: 2Gi

      pdb:
        create: true
        minAvailable: 1

      resources:
        requests:
          cpu: 200m
          memory: 384Mi
        limits:
          cpu: 600m
          memory: 1Gi

      nodeSelector:
        workload: stateful
        topology: ap-south-1a

      tolerations:
        - key: workload
          operator: Equal
          value: stateful
          effect: NoSchedule

      initdb:
        scripts:
          01-create-edulearn-databases.sql: |
            SELECT 'CREATE DATABASE auth_service'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'auth_service')\gexec

            SELECT 'CREATE DATABASE user_service'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'user_service')\gexec

            SELECT 'CREATE DATABASE course_service'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'course_service')\gexec

            SELECT 'CREATE DATABASE notification_service'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'notification_service')\gexec

            SELECT 'CREATE DATABASE order_service'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'order_service')\gexec

            SELECT 'CREATE DATABASE payment_service'
            WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'payment_service')\gexec

    readReplicas:
      enabled: false

    service:
      type: ClusterIP
      port: 5432

  externalSecret:
    enabled: true
    targetSecretName: postgres
    refreshInterval: 1h

    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore

    data:
      - secretKey: postgres-password
        remoteKey: edulearn/prod/postgres
        property: postgres-password

      - secretKey: password
        remoteKey: edulearn/prod/postgres
        property: password

      - secretKey: username
        remoteKey: edulearn/prod/postgres
        property: username

      - secretKey: database
        remoteKey: edulearn/prod/postgres
        property: database

    metrics:
      enabled: true

      serviceMonitor:
        enabled: true
        namespace: monitoring

        labels:
          release: kube-prometheus-stack

        interval: 30s
kafka:
  enabled: true

  kafka:
    image:
      registry: docker.io
      repository: bitnamilegacy/kafka
      tag: 4.0.0-debian-12-r10

    kraft:
      enabled: true

    zookeeper:
      enabled: false

    controller:
      replicaCount: 1
      controllerOnly: true

      nodeSelector:
        workload: stateful
        topology: ap-south-1a

      tolerations:
        - key: workload
          operator: Equal
          value: stateful
          effect: NoSchedule

      persistence:
        enabled: true
        storageClass: gp3
        size: 2Gi

      pdb:
        create: true
        minAvailable: 1

      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 400m
          memory: 512Mi

    broker:
      replicaCount: 1

      persistence:
        enabled: true
        storageClass: gp3
        size: 2Gi

      nodeSelector:
        workload: stateful

      tolerations:
        - key: workload
          operator: Equal
          value: stateful
          effect: NoSchedule

      pdb:
        create: true
        minAvailable: 1

      resources:
        requests:
          cpu: 150m
          memory: 384Mi
        limits:
          cpu: 600m
          memory: 768Mi

      overrideConfiguration:
        offsets.topic.replication.factor: 1
        transaction.state.log.replication.factor: 1
        transaction.state.log.min.isr: 1
        default.replication.factor: 1
        min.insync.replicas: 1
        num.partitions: 1

    listeners:
      client:
        protocol: PLAINTEXT

      controller:
        protocol: PLAINTEXT

      interbroker:
        protocol: PLAINTEXT

    autoCreateTopicsEnable: true
    deleteTopicEnable: true

    defaultReplicationFactor: 1
    offsetsTopicReplicationFactor: 1
    transactionStateLogReplicationFactor: 1
    transactionStateLogMinIsr: 1

    networkPolicy:
      enabled: true # false

  metrics:
    kafka:
      enabled: true

    jmx:
      enabled: true

    serviceMonitor:
      enabled: true
      namespace: monitoring

      labels:
        release: kube-prometheus-stack

      interval: 30s
