global:
  configMaps:
    - edulearn-config

  secretRefs:
    - edulearn-secret

fullnameOverride: edulearn

api-gateway:
  enabled: true
  fullnameOverride: edulearn-api-gateway

  replicaCount: 2

  serviceAccount:
    create: true
    name: api-gateway-sa
    automount: true
    annotations: {}

  image:
    repository: ghcr.io/muhammed-shafeeque-th/edulearn/gateway
    pullPolicy: IfNotPresent
    tag: "v1.1.11"

  service:
    type: ClusterIP
    ports:
      - name: http
        port: 3000
        targetPort: 3000
      - name: api
        port: 4000
        targetPort: 4000

  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
    port: http

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - stateless

  env:
    NODE_ENV: "production"
    PORT: "4000"
    HTTP_PORT: "3000"
    SERVICE_NAME: api-gateway
    serviceVersion: "0.0.1"

  configMaps:
    - edulearn-api-gateway-config

  secretRefs:
    - edulearn-api-gateway-secret

  externalSecret:
    enabled: true
    refreshInterval: 5m
    targetSecretName: edulearn-api-gateway

    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore

    dataFrom:
      - extract:
          key: edulearn/prod/api-gateway

  configData:
    METRICS_PATH: /metrics
    METRICS_ENABLED: "true"

    # Logging Configuration
    LOG_LEVEL: info
    LOG_FORMAT: json

    TRACING_SAMPLING_RATE: "0.1"
    TRACING_SERVICE_NAME: gateway-service

  secretData: {}
  configMounts: []

auth:
  enabled: true
  fullnameOverride: edulearn-auth

  replicaCount: 2 # auth is a critical path, needs HA

  # ADDED: pod disruption budget — with replicaCount 2, a node drain could
  # previously take both replicas down at once; this guarantees at least 1
  # stays up during voluntary disruptions.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  # This causes replicas to be spread across zones. with replicaCount: 3  auth-1 → 1a, auth-2 → 1b, auth-3 → 1c. instead of all landing in 1a.
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway

  # ADDED: spread the two replicas across nodes so they don't co-locate and
  # defeat the point of running 2 for HA.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: auth
                app.kubernetes.io/instance: "{{ .Release.Name }}"
            topologyKey: kubernetes.io/hostname

    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: workload
                operator: In
                values:
                  - stateless

  image:
    repository: ghcr.io/muhammed-shafeeque-th/edulearn/auth
    pullPolicy: IfNotPresent
    tag: "v1.1.11"

  service:
    type: ClusterIP
    ports:
      - name: http
        port: 3000
        targetPort: 3000
      - name: grpc
        port: 50051
        targetPort: 50051

  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics
    port: http

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 512Mi

  autoscaling:
    enabled: false

    # Minimum number of pods to always run
    minReplicas: 2

    # Maximum number of pods allowed during peak load
    maxReplicas: 10

    # CPU target utilization (good default for most stateless APIs)
    targetCPUUtilizationPercentage: 70

    # Memory target (enable only if your workload is memory-sensitive)
    targetMemoryUtilizationPercentage: 75

    behavior:
      scaleUp:
        # React quickly to traffic spikes
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 2
            periodSeconds: 15

      scaleDown:
        # Prevent flapping during traffic drops
        stabilizationWindowSeconds: 300
        selectPolicy: Min
        policies:
          - type: Percent
            value: 50
            periodSeconds: 60

  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5

  env:
    NODE_ENV: "production"
    SERVICE_NAME: auth-service
    serviceVersion: "0.0.1"
    HTTP_PORT: 3000
    GRPC_PORT: 50051

  configMaps:
    - edulearn-auth-config

  secretRefs:
    - edulearn-auth-secret

  externalSecret:
    enabled: true
    refreshInterval: 5m
    targetSecretName: edulearn-auth

    secretStoreRef:
      name: aws-secrets-manager
      kind: ClusterSecretStore

    dataFrom:
      - extract:
          key: edulearn/prod/auth

  configData:
    POSTGRES_HOST: edulearn-app-postgresql
    POSTGRES_PORT: "5432"
    POSTGRES_DB: auth_service
    POSTGRES_USER: postgres
    POSTGRES_SSL_MODE: disable
    DB_MAX_OPEN_CONNS: "25"
    DB_MAX_IDLE_CONNS: "5"

    TEMPLATE_BASE_DIR: dist/shared/templates
    COMPANY_NAME: EduLearn
    COMPANY_ADDRESS: EduLearn Inc., 456 Learning Avenue, San Francisco, CA 94102
    SUPPORT_EMAIL: support@edulearn.com
    BASE_URL: https://edulearn.muhammedshafeeque.online

    TWITTER_URL: https://twitter.com/web_edulearn
    FACEBOOK_URL: https://facebook.com/web_edulearn
    LINKEDIN_URL: https://linkedin.com/company/web_edulearn
    INSTAGRAM_URL: https://instagram.com/web_edulearn
    YOUTUBE_URL: https://youtube.com/@web_edulearn

    REDIS_DB: "1"
    REDIS_MAX_CONNECTIONS: "100"
    REDIS_MIN_CONNECTIONS: "10"
    REDIS_TTL_DEFAULT: "86400"
    REDIS_KEY_PREFIX: "edulearn:auth:"

    GRPC_PORT: "50051"
    GRPC_MAX_CONCURRENT_STREAMS: "100"
    GRPC_MAX_CONNECTION_IDLE: 15s
    GRPC_MAX_CONNECTION_AGE_GRACE: 5s

    KAFKA_CLIENT_ID: auth-service
    KAFKA_CONSUMER_GROUP: auth-service-group
    KAFKA_MAX_POLL_RECORDS: "100"
    KAFKA_FETCH_MAX_BYTES: "5242880"
    KAFKA_SASL_ENABLED: "false"

    LOG_LEVEL: info

  secretData: {}
  configMounts: []

